<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>九州南北朝戦記 (Wasm)</title>
    <style>
        body { 
            background: #222; 
            color: #fff; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; /* スクロール禁止 */
            width: 100vw;
            height: 100vh;
        }
        canvas { 
            display: block;
            background: #001133; 
            touch-action: none; /* ブラウザ標準のタッチアクションを無効化 */
        }
        
        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* UI以外の場所へのタッチはCanvasに通す */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Bar */
        .status-bar { 
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1em;
            pointer-events: auto;
            border-bottom: 1px solid #555;
        }

        /* Bottom Controls */
        .controls-container {
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            pointer-events: auto;
            border-top: 1px solid #555;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .log { 
            color: #ecf0f1; 
            height: 3em; 
            overflow-y: auto; 
            font-family: monospace; 
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .button-group {
            display: flex;
            justify-content: space-around;
            gap: 10px;
        }

        .button { 
            flex: 1;
            background: #e67e22; 
            color: white; 
            border: none; 
            padding: 12px 5px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.9em;
            text-align: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .button:active { background: #d35400; transform: translateY(2px); }
        .button.secondary { background: #7f8c8d; }
        .button.info { background: #2980b9; }

        /* Encyclopedia Modal */
        #modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            z-index: 100;
            pointer-events: auto;
        }
        #modal-content {
            background: #2c3e50;
            border: 2px solid #34495e;
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            pointer-events: auto;
        }
        #modal-content h2 { color: #f1c40f; margin-top: 0; border-bottom: 1px solid #f1c40f; padding-bottom: 10px; }
        #modal-content h3 { color: #3498db; margin-bottom: 5px; font-size: 1.1em; }
        #modal-content p { line-height: 1.6; font-size: 0.9em; margin-bottom: 20px; color: #ecf0f1; }
        #modal-close {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            float: right;
            font-weight: bold;
        }

        .south { color: #e74c3c; }
        .north { color: #3498db; }
        .independent { color: #f1c40f; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div class="status-bar">
            <div><span id="year">1338</span>年 <span id="month"></span>月</div>
            <div id="turn-display"><span id="turn-name" class="south">南朝</span></div>
        </div>

        <div class="controls-container">
            <div id="log" class="log">初期化中...</div>
            <div class="button-group">
                <button id="btn-info" class="button info">資料 (E)</button>
                <button id="btn-force" class="button secondary">強行軍 (F)</button>
                <button id="btn-harvest" class="button secondary">刈田 (K)</button>
                <button id="btn-end-turn" class="button">終了</button>
            </div>
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal-content">
            <button id="modal-close">閉じる</button>
            <h2>九州南北朝資料館</h2>
            <div id="encyclopedia-body">
                <!-- 資料内容がここに挿入される -->
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script type="module">
        import init, { GameState, Faction } from './pkg/kyushu_wasm_wars.js';

        async function run() {
            await init();
            const state = new GameState();
            let encyclopediaData = [];
            
            // JSONデータの読み込み
            try {
                const response = await fetch('kyushu_data.json');
                const jsonText = await response.text();
                const fullData = JSON.parse(jsonText);
                encyclopediaData = fullData.encyclopedia || [];
                state.load_json(jsonText);
            } catch (e) {
                console.error("Failed to load map data:", e);
                document.getElementById('log').innerText = "データ読み込みエラー";
            }

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            
            // 画面サイズに合わせてCanvasをリサイズ
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // 表示設定
            let hexSize = 40; 
            let offsetX = canvas.width / 2 - 200; 
            let offsetY = canvas.height / 2 - 200;

            // タッチ操作用変数
            let isDragging = false;
            let lastTouchX = 0;
            let lastTouchY = 0;
            let touchStartX = 0;
            let touchStartY = 0;
            const TAP_THRESHOLD = 10; 

            function getHexCoords(q, r) {
                const x = hexSize * (3/2 * q);
                const y = hexSize * Math.sqrt(3) * (r + (q % 2) / 2);
                return { x: x + offsetX, y: y + offsetY };
            }

            function drawHex(q, r, color, isCursor, isSelected) {
                const { x, y } = getHexCoords(q, r);
                if (x < -hexSize || x > canvas.width + hexSize || y < -hexSize || y > canvas.height + hexSize) return;

                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = 2 * Math.PI / 6 * i;
                    const px = x + hexSize * Math.cos(angle);
                    const py = y + hexSize * Math.sin(angle);
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();
                
                if (isCursor) {
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 4;
                    ctx.stroke();
                } else if (isSelected) {
                    ctx.strokeStyle = '#f1c40f';
                    ctx.lineWidth = 4;
                    ctx.stroke();
                } else {
                    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }

            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // マップ描画 (範囲を拡大: q: 0~11, r: -2~11)
                for (let r = -2; r <= 11; r++) {
                    for (let q = 0; q <= 11; q++) {
                        const isCursor = q === state.cursor_q && r === state.cursor_r;
                        const color = state.get_terrain_color(q, r);
                        drawHex(q, r, color, isCursor, false);
                    }
                }

                // 拠点描画
                const locCount = state.get_location_count();
                for (let i = 0; i < locCount; i++) {
                    const q = state.get_location_q_at(i);
                    const r = state.get_location_r_at(i);
                    const { x, y } = getHexCoords(q, r);
                    if (x < -hexSize || x > canvas.width + hexSize || y < -hexSize || y > canvas.height + hexSize) continue;

                    const name = state.get_location_name_at(i);
                    const type = state.get_location_type_at(i);

                    ctx.fillStyle = "rgba(0,0,0,0.4)";
                    ctx.fillRect(x - 30, y - 40, 60, 18);
                    ctx.fillStyle = "#f1c40f";
                    ctx.font = "bold 12px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(name, x, y - 26);
                    ctx.fillStyle = "#fff";
                    ctx.font = "20px serif";
                    ctx.fillText(type === "要塞" || type === "山城" ? "🏯" : "⚓", x, y - 5);
                }

                // ユニット描画
                const unitCount = state.get_unit_count();
                for (let i = 0; i < unitCount; i++) {
                    const q = state.get_unit_q(i);
                    const r = state.get_unit_r(i);
                    const { x, y } = getHexCoords(q, r);
                    if (x < -hexSize || x > canvas.width + hexSize || y < -hexSize || y > canvas.height + hexSize) continue;

                    const name = state.get_unit_name(i);
                    const faction = state.get_unit_faction(i);
                    const isSelected = state.is_selected_unit(i);

                    if (isSelected) {
                        ctx.beginPath();
                        ctx.arc(x, y, hexSize * 0.9, 0, Math.PI * 2);
                        ctx.strokeStyle = '#f1c40f';
                        ctx.setLineDash([5, 5]);
                        ctx.lineWidth = 3;
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                    
                    ctx.beginPath();
                    ctx.arc(x, y, hexSize * 0.7, 0, Math.PI * 2);
                    const grad = ctx.createRadialGradient(x-5, y-5, 2, x, y, hexSize*0.7);
                    if (faction === Faction.South) {
                        grad.addColorStop(0, '#ff7675'); grad.addColorStop(1, '#d63031');
                    } else if (faction === Faction.North) {
                        grad.addColorStop(0, '#74b9ff'); grad.addColorStop(1, '#0984e3');
                    } else {
                        grad.addColorStop(0, '#ffeaa7'); grad.addColorStop(1, '#fdcb6e');
                    }
                    ctx.fillStyle = grad;
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    
                    ctx.fillStyle = '#fff';
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = 'black';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.textAlign = 'center';
                    
                    const hp = state.get_unit_hp(i);
                    const atk = state.get_unit_atk(i);
                    ctx.fillText(name, x, y - 6);
                    ctx.font = '10px sans-serif';
                    ctx.fillText(`⚔${atk} ❤️${hp}`, x, y + 10);
                    ctx.shadowBlur = 0;
                }

                // UI更新
                document.getElementById('year').innerText = `${state.year}`;
                document.getElementById('month').innerText = `${state.month}`;

                const turnNameMap = { [Faction.South]: '南朝', [Faction.North]: '北朝', [Faction.Independent]: '在地勢力' };
                const turnName = turnNameMap[state.turn];
                const turnEl = document.getElementById('turn-name');
                turnEl.innerText = turnName;
                
                const factionClassMap = { [Faction.South]: 'south', [Faction.North]: 'north', [Faction.Independent]: 'independent' };
                turnEl.className = factionClassMap[state.turn];
                
                const logEl = document.getElementById('log');
                if (logEl.innerText !== state.log) {
                    logEl.innerText = state.log;
                    logEl.scrollTop = logEl.scrollHeight;
                }

                if (state.turn !== Faction.South && !window.aiRunning) {
                    window.aiRunning = true;
                    setTimeout(() => { state.run_ai_turn(); window.aiRunning = false; }, 800);
                }

                requestAnimationFrame(render);
            }

            // 入力ハンドリング
            function pixelToHex(x, y) {
                const q = Math.round((x - offsetX) / (hexSize * 1.5));
                const r = Math.round((y - offsetY) / (hexSize * Math.sqrt(3)) - (q % 2) / 2);
                return { q, r };
            }

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                lastTouchX = touch.clientX; lastTouchY = touch.clientY;
                touchStartX = touch.clientX; touchStartY = touch.clientY;
                isDragging = false;
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const dx = touch.clientX - lastTouchX;
                const dy = touch.clientY - lastTouchY;
                if (Math.abs(touch.clientX - touchStartX) > TAP_THRESHOLD || Math.abs(touch.clientY - touchStartY) > TAP_THRESHOLD) isDragging = true;
                if (isDragging) { offsetX += dx; offsetY += dy; }
                lastTouchX = touch.clientX; lastTouchY = touch.clientY;
            }, { passive: false });

            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (!isDragging) {
                    const { q, r } = pixelToHex(lastTouchX, lastTouchY);
                    state.click_hex(q, r);
                }
                isDragging = false;
            });

            canvas.addEventListener('mousedown', (e) => {
                isMouseDown = true; lastTouchX = e.clientX; lastTouchY = e.clientY;
                touchStartX = e.clientX; touchStartY = e.clientY; isDragging = false;
            });
            let isMouseDown = false;
            canvas.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                const dx = e.clientX - lastTouchX;
                const dy = e.clientY - lastTouchY;
                if (Math.abs(e.clientX - touchStartX) > 5 || Math.abs(e.clientY - touchStartY) > 5) isDragging = true;
                if (isDragging) { offsetX += dx; offsetY += dy; }
                lastTouchX = e.clientX; lastTouchY = e.clientY;
            });
            canvas.addEventListener('mouseup', (e) => {
                isMouseDown = false;
                if (!isDragging) {
                    const { q, r } = pixelToHex(e.clientX, e.clientY);
                    state.click_hex(q, r);
                }
                isDragging = false;
            });

            // UIボタンイベント
            document.getElementById('btn-info').addEventListener('click', (e) => { e.stopPropagation(); showEncyclopedia(); });
            document.getElementById('modal-close').addEventListener('click', () => { document.getElementById('modal-overlay').style.display = 'none'; });
            document.getElementById('btn-end-turn').addEventListener('click', (e) => { e.stopPropagation(); state.handle_input('t'); });
            document.getElementById('btn-force').addEventListener('click', (e) => { e.stopPropagation(); state.handle_input('f'); });
            document.getElementById('btn-harvest').addEventListener('click', (e) => { e.stopPropagation(); state.handle_input('k'); });

            function showEncyclopedia() {
                const body = document.getElementById('encyclopedia-body');
                body.innerHTML = '';
                if (encyclopediaData.length === 0) {
                    body.innerHTML = '<p>資料データが見つかりません。</p>';
                } else {
                    encyclopediaData.forEach(item => {
                        const section = document.createElement('div');
                        section.innerHTML = `<h3>${item.title}</h3><p>${item.content}</p>`;
                        body.appendChild(section);
                    });
                }
                document.getElementById('modal-overlay').style.display = 'flex';
            }

            // キーボード
            window.addEventListener('keydown', (e) => {
                if (e.key === 'e' || e.key === 'E') showEncyclopedia();
                if (e.key === 'f' || e.key === 'F') state.handle_input('f');
                if (e.key === 'k' || e.key === 'K') state.handle_input('k');
                if (e.key === 't' || e.key === 'T') state.handle_input('t');
                if (e.key.startsWith('Arrow')) state.handle_input(e.key);
            });

            render();
        }

        run();
    </script>
</body>
</html>
